# Geração automática de audiobooks no repositório público, sem APIs pagas.
# O site permanece 100% estático: Python e modelo rodam somente no runner.
name: Gerar áudio neural (pt-BR)

on:
  push:
    branches:
      - main
      - feat/narracao-neural
    paths:
      - 'livros/**/index.html'
      - 'scripts/generate_audio.py'
      - 'scripts/requirements-audio.txt'
      - 'scripts/test_generate_audio.py'
      - '.github/workflows/generate-audio.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: biblioteca-tts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Buscar arquivos da branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-audio.txt

      - name: Dependências de áudio e português brasileiro
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python -m pip install --disable-pip-version-check -r scripts/requirements-audio.txt

      - name: Verificar estrutura dos textos e segmentação
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Cache do modelo Kokoro
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/biblioteca-kokoro
          key: biblioteca-kokoro-v1-ptbr

      - name: Gerar apenas os áudios ausentes ou alterados
        run: |
          python scripts/generate_audio.py --model-dir "${{ runner.temp }}/biblioteca-kokoro"

      - name: Registrar MP3s e manifestos na mesma branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio
          if git diff --cached --quiet; then
            echo "Nenhum áudio mudou."
          else
            git commit -m "chore(audio): atualizar narração neural gerada [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
