# Geração automática de audiobooks no repositório público, sem APIs pagas.
# O site permanece 100% estático: Python e modelo rodam somente no runner.
name: Gerar áudio neural (pt-BR)

on:
  push:
    branches:
      - '**'
    paths:
      - 'livros/**/index.html'
      - 'scripts/generate_audio.py'
      - 'scripts/requirements-audio.txt'
      - 'scripts/test_generate_audio.py'
      - '.github/workflows/generate-audio.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: biblioteca-tts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Buscar arquivos da branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-audio.txt

      - name: Dependências de áudio e português brasileiro
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python -m pip install --disable-pip-version-check -r scripts/requirements-audio.txt

      - name: Verificar estrutura dos textos e segmentação
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Cache do modelo Kokoro
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/biblioteca-kokoro
          key: biblioteca-kokoro-v1-ptbr

      - name: Gerar e publicar áudio incrementalmente por livro
        shell: bash
        env:
          MODEL_DIR: ${{ runner.temp }}/biblioteca-kokoro
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # O push pode chegar enquanto outro commit é publicado. Em vez de
          # perder toda a geração, sincronizamos sem forçar o histórico.
          for html in livros/*/index.html; do
            book="$(basename "$(dirname "$html")")"
            echo "::group::Gerando e publicando $book"
            python scripts/generate_audio.py --book "$book" --model-dir "$MODEL_DIR"
            git add -A -- "assets/audio/$book"
            if git diff --cached --quiet; then
              echo "Nenhuma alteração em $book."
              echo "::endgroup::"
              continue
            fi
            git commit -m "chore(audio): atualizar narração de $book [skip ci]"

            pushed=false
            for attempt in 1 2 3 4 5; do
              echo "Sincronização e push de $book (tentativa $attempt/5)"
              git fetch origin "$GITHUB_REF_NAME"
              git rebase FETCH_HEAD
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                pushed=true
                break
              fi
              sleep 3
            done
            if [ "$pushed" != true ]; then
              echo "::error::Não foi possível enviar $book após 5 tentativas."
              exit 1
            fi
            echo "::endgroup::"
          done

      # Quando Pages estiver configurado para 'GitHub Actions', publica
      # no mesmo workflow: pushes feitos por GITHUB_TOKEN não disparam Pages.
      - name: Preparar site estático com novos MP3s
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  publish:
    if: github.ref == 'refs/heads/main'
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar arquivos estáticos no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
