name: Verificar interface e controles de áudio

on:
  push:
    branches:
      - '**'
    paths:
      - 'assets/js/**'
      - 'assets/css/**'
      - 'index.html'
      - 'livros/**/index.html'
      - 'assets/music-background.mp3'
      - '.github/workflows/verify-audio-ui.yml'
  pull_request:
    paths:
      - 'assets/js/**'
      - 'assets/css/**'
      - 'index.html'
      - 'livros/**/index.html'
      - '.github/workflows/verify-audio-ui.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checar sintaxe de módulos JavaScript
        run: |
          for script in assets/js/*.js; do
            echo "Validando ${script}"
            node --input-type=module --check < "$script"
          done
      - name: Conferir catálogo e retomada individual
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path('index.html').read_text(encoding='utf-8')
          script = Path('assets/js/main.js').read_text(encoding='utf-8')
          css = Path('assets/css/styles.css').read_text(encoding='utf-8')
          books = re.findall(r'<article class="book-card" data-book-card="([^"]+)"[\s\S]*?</article>', source)
          assert len(books) == len(set(books)) == 6, books
          assert source.count('class="book-cover-link"') == 6
          assert source.count('class="book-summary"') == 6
          assert source.count('data-resume-link') == 6
          assert source.count('role="progressbar"') == 6
          assert not re.search(r'data-continue-banner', source)
          assert 'getProgress(book.dataset.bookCard)' in script
          assert "querySelector('[data-resume-link]')" in script
          assert 'grid-template-columns:minmax(0,1fr)' in css
          assert 'book-summary p' in css
          print('Seis livros, uma obra por linha e retomada individual: OK')
          PY
      - name: Verificar tipografia sans e remoção do campo de notas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          css = Path('assets/css/styles.css').read_text(encoding='utf-8')
          reader = Path('assets/js/reader.js').read_text(encoding='utf-8')
          assert '--reading-font:var(--ui)' in css
          assert "system-ui" in css
          assert 'var(--serif)' not in css
          assert '--serif:' not in css
          assert '.reading-body{font:400 var(--reader-font-size)/1.8 var(--reading-font)' in css
          assert "notesKey" not in reader
          assert "getProgress(slug)" in reader and "setProgress(slug" in reader
          books = list(Path('livros').glob('*/index.html'))
          assert len(books) == 6, books
          for book in books:
              page = book.read_text(encoding='utf-8')
              assert 'class="reflections"' not in page, book
              assert 'id="personal-notes"' not in page, book
              assert 'data-notes' not in page, book
              assert 'data-clear-notes' not in page, book
              assert re.search(r'<section id="[^"]+" class="reading-section" data-chapter', page), book
              assert 'data-readable' in page, book
              assert 'data-reset-progress' in page, book
          print('Fonte sem serifa e seis livros sem formulário de notas: OK')
          PY
      - name: Conferir áudio ambiente e entrada do leitor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          js = Path('assets/js/main.js').read_text(encoding='utf-8')
          bg = Path('assets/js/background-music.js').read_text(encoding='utf-8')
          voice = Path('assets/js/narration-volume.js').read_text(encoding='utf-8')
          neural = Path('assets/js/audio.js').read_text(encoding='utf-8')
          native = Path('assets/js/speech.js').read_text(encoding='utf-8')
          assert Path('assets/music-background.mp3').is_file()
          assert Path('assets/music-background.mp3').stat().st_size > 100_000
          assert 'initBackgroundMusic()' in js
          assert "audio.loop = true" in bg
          assert "musicMuted" in bg and "musicVolume" in bg
          assert "createMediaElementSource" in voice
          assert "createDynamicsCompressor" in voice
          assert "max = canBoost ? 200 : 100" in voice
          assert "mountNarrationVolume({ player, audio })" in neural
          assert "mountNarrationVolume({ player })" in native
          assert "utterance.volume =" in native
          for page in [Path('index.html'), *Path('livros').glob('*/index.html')]:
              assert 'assets/js/main.js' in page.read_text(encoding='utf-8'), page
          print('Música ambiente, volume de voz e entrada das páginas verificados.')
          PY
